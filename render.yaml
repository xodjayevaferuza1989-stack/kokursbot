services:
  - type: web
    name: konkursbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: starter
    healthCheckPath: /
    disk:
      name: konkursbot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DB_PATH
        value: /var/data/bot.db
      - key: MULTI_REPORT_MIN
        value: "3"
