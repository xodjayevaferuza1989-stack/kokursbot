<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060a18">
<title>Qurilma tekshiruvi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  :root {
    --bg1:#060a18; --bg2:#101a3d; --fg:#eef1ff; --muted:#98a3c9;
    --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.13);
    --a1:#6d8dff; --a2:#9b6bff; --a3:#22d3ee;
    --ok:#2ee59d; --bad:#ff5c7a; --warn:#ffc857;
    --dot:255,255,255; --blob:.38;
    --shadow:0 24px 70px rgba(0,0,0,.5);
  }
  [data-theme=light] {
    --bg1:#eef2ff; --bg2:#d9e2ff; --fg:#141a3a; --muted:#59628a;
    --card:rgba(255,255,255,.74); --line:rgba(40,55,120,.14);
    --a1:#4f6dff; --a2:#8a4fff; --a3:#0ab3d6;
    --ok:#12b97a; --bad:#e5385a; --warn:#d99a00;
    --dot:60,80,200; --blob:.26;
    --shadow:0 20px 50px rgba(60,80,160,.22);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    background:radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg1));
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    padding:max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  /* ---------- fon ---------- */
  .aurora { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .aurora i { position:absolute; width:62vmax; height:62vmax; border-radius:50%;
              filter:blur(80px); opacity:var(--blob); }
  .aurora i:nth-child(1) { background:var(--a1); left:-22vmax; top:-18vmax; animation:drift1 16s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { background:var(--a2); right:-26vmax; top:14vmax; animation:drift2 19s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { background:var(--a3); left:6vmax; bottom:-34vmax; animation:drift3 22s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(16vmax,12vmax) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-14vmax,-10vmax) scale(.9); } }
  @keyframes drift3 { to { transform:translate(10vmax,-14vmax) scale(1.2); } }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }

  /* ---------- karta ---------- */
  .card {
    --g1:var(--a1); --g2:var(--a3); --glow:rgba(109,141,255,.5);
    position:relative; z-index:2; width:100%; max-width:360px; text-align:center;
    padding:34px 24px 22px; border-radius:28px;
    background:var(--card); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%);
    box-shadow:var(--shadow);
    animation:rise .8s cubic-bezier(.2,.9,.3,1.08) both;
  }
  .card[data-state=ok]   { --g1:var(--ok);  --g2:var(--a3); --glow:rgba(46,229,157,.5); }
  .card[data-state=bad]  { --g1:var(--bad); --g2:var(--a2); --glow:rgba(255,92,122,.5); }
  .card[data-state=err],
  .card[data-state=out]  { --g1:var(--warn); --g2:var(--bad); --glow:rgba(255,200,87,.45); }
  @keyframes rise { from { opacity:0; transform:translateY(28px) scale(.94); } }

  /* aylanuvchi gradient hoshiya */
  .card::before {
    content:""; position:absolute; inset:-1px; border-radius:29px; padding:1.5px; pointer-events:none;
    background:conic-gradient(from var(--ang), transparent 0 55%, var(--g1), var(--g2), transparent 95%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:spin 3.4s linear infinite;
  }
  @keyframes spin { to { --ang:360deg; } }

  /* ---------- nishon ---------- */
  .badge { position:relative; width:116px; height:116px; margin:0 auto 22px; animation:float 4.2s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-7px); } }
  .ring { position:absolute; inset:6px; border-radius:50%; border:2px solid var(--g1); opacity:0; }
  [data-state=scan] .ring { animation:pulse 2.6s ease-out infinite; }
  [data-state=scan] .ring.r2 { animation-delay:1.3s; }
  [data-state=ok] .ring.r1 { animation:burst 1s ease-out both; }
  @keyframes pulse { 0% { transform:scale(.7); opacity:.7; } 100% { transform:scale(1.55); opacity:0; } }
  @keyframes burst { 0% { transform:scale(.8); opacity:.9; } 100% { transform:scale(1.9); opacity:0; } }
  [data-state=bad] .badge { animation:shake .55s both; }
  @keyframes shake { 15%,45%,75% { transform:translateX(-9px); } 30%,60%,90% { transform:translateX(9px); } }

  .shield { position:absolute; inset:0; width:100%; height:100%; overflow:visible;
            filter:drop-shadow(0 10px 26px var(--glow)); }
  .ico { opacity:0; fill:none; stroke:var(--fg); stroke-width:5; stroke-linecap:round; stroke-linejoin:round;
         transition:opacity .3s; }
  [data-state=scan] .ico-scan, [data-state=ok] .ico-ok, [data-state=bad] .ico-bad,
  [data-state=err] .ico-warn, [data-state=out] .ico-warn { opacity:1; }
  .ico-ok { stroke-dasharray:1; stroke-dashoffset:1; }
  [data-state=ok] .ico-ok { stroke-dashoffset:0; transition:stroke-dashoffset .6s .2s ease, opacity .1s; }
  .sweep { display:none; }
  [data-state=scan] .sweep { display:block; animation:sweep 1.7s ease-in-out infinite alternate; }
  @keyframes sweep { from { transform:translateY(0); } to { transform:translateY(92px); } }
  .dotpulse { animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }

  /* ---------- matn ---------- */
  h1 { font-size:22px; line-height:1.2; font-weight:750; letter-spacing:-.01em; margin:0 0 8px;
       background:linear-gradient(135deg, var(--fg) 30%, var(--g1));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  #msg { margin:0 auto; max-width:300px; color:var(--muted); font-size:14.5px; line-height:1.5; min-height:22px; }
  .swap { animation:swap .45s ease both; }
  @keyframes swap { from { opacity:0; transform:translateY(8px); } }

  /* ---------- bosqichlar ---------- */
  .steps { list-style:none; margin:22px 0 0; padding:0; display:grid; gap:9px; text-align:left; }
  [data-state=out] .steps { display:none; }
  .steps li { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:14px;
              background:rgba(var(--dot),.05); border:1px solid var(--line);
              font-size:13.5px; color:var(--muted); opacity:.5; transform:translateY(6px);
              transition:opacity .4s, transform .4s, color .3s, border-color .3s; }
  .steps li.act, .steps li.done, .steps li.fail { opacity:1; transform:none; color:var(--fg); }
  .steps li.act  { border-color:var(--g1); }
  .steps li.done { border-color:rgba(46,229,157,.4); }
  .steps li.fail { border-color:rgba(255,92,122,.5); }
  .d { position:relative; flex:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--line); }
  .act .d { border-color:rgba(var(--dot),.2); border-top-color:var(--g1); animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .done .d { background:var(--ok); border-color:var(--ok); animation:pop .4s ease; }
  .done .d::after { content:""; position:absolute; left:5.5px; top:2px; width:5px; height:9px;
                    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .fail .d { background:var(--bad); border-color:var(--bad); animation:pop .4s ease; }
  .fail .d::after { content:"!"; position:absolute; inset:0; color:#fff; font:700 12px/16px sans-serif; text-align:center; }
  @keyframes pop { 0% { transform:scale(.4); } 70% { transform:scale(1.2); } 100% { transform:scale(1); } }

  /* ---------- progress ---------- */
  .bar { height:5px; border-radius:99px; background:rgba(var(--dot),.1); overflow:hidden; margin-top:20px; }
  .bar i { display:block; height:100%; width:40%; border-radius:inherit; background:linear-gradient(90deg, var(--g1), var(--g2)); }
  [data-state=scan] .bar i { animation:slide 1.3s ease-in-out infinite; }
  [data-state=ok] .bar i { width:100%; animation:drain 2.2s linear forwards; }
  [data-state=bad] .bar, [data-state=err] .bar, [data-state=out] .bar { display:none; }
  @keyframes slide { 0% { transform:translateX(-110%); } 100% { transform:translateX(280%); } }
  @keyframes drain { from { width:100%; } to { width:0; } }

  .btn { margin-top:18px; width:100%; padding:14px; border:0; border-radius:16px; cursor:pointer;
         font-family:inherit; font-size:15px; font-weight:650; color:#fff;
         background:linear-gradient(135deg, var(--g1), var(--g2)); box-shadow:0 10px 26px var(--glow);
         transition:transform .15s; animation:swap .45s ease both; }
  .btn:active { transform:scale(.97); }
  .btn[hidden] { display:none; }
  .foot { margin-top:16px; font-size:11.5px; color:var(--muted); opacity:.8; letter-spacing:.02em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <canvas id="fx"></canvas>

  <main class="card" id="card" data-state="scan">
    <div class="badge" id="badge">
      <div class="ring r1"></div><div class="ring r2"></div>
      <svg class="shield" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/>
          </linearGradient>
          <clipPath id="sc"><path d="M60 12 100 27v29c0 25-17 43-40 52C37 99 20 81 20 56V27z"/></clipPath>
        </defs>
        <path d="M60 12 100 27v29c0 25-17 43-40 52C37 99 20 81 20 56V27z"
              fill="url(#gs)" fill-opacity=".2" stroke="url(#gs)" stroke-width="3.5" stroke-linejoin="round"/>
        <g clip-path="url(#sc)"><rect class="sweep" x="10" y="12" width="100" height="14" fill="url(#gs)" opacity=".6"/></g>

        <g class="ico ico-scan">
          <rect x="47" y="39" width="26" height="42" rx="6" style="stroke-width:4"/>
          <circle class="dotpulse" cx="60" cy="73" r="2" style="fill:var(--fg);stroke:none"/>
        </g>
        <path class="ico ico-ok" pathLength="1" d="M41 61l13 13 26-28"/>
        <path class="ico ico-bad" d="M47 47l26 26M73 47L47 73"/>
        <g class="ico ico-warn"><path d="M60 40v24"/><circle cx="60" cy="77" r="3" style="fill:var(--fg);stroke:none"/></g>
      </svg>
    </div>

    <h1 id="title">Qurilma tekshirilmoqda</h1>
    <p id="msg">Bir necha soniya kuting…</p>

    <ul class="steps" id="steps">
      <li><span class="d"></span>Qurilma belgilari yig'ilmoqda</li>
      <li><span class="d"></span>Telegram imzosi tekshirilmoqda</li>
      <li><span class="d"></span>Natija olinmoqda</li>
    </ul>

    <div class="bar"><i></i></div>
    <button class="btn" id="btn" hidden type="button">Qayta urinish</button>
    <div class="foot">🔒 Xavfsiz qurilma tekshiruvi</div>
  </main>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const root = document.documentElement;
const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark'
           : window.matchMedia('(prefers-color-scheme: dark)').matches;
root.dataset.theme = dark ? 'dark' : 'light';
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  try { const c = dark ? '#060a18' : '#eef2ff'; tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}
}
/* ---------- til (uz / ru): ?l=ru yoki Telegram tili ---------- */
const LANG = (new URLSearchParams(location.search).get('l')
  || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || '').toLowerCase().startsWith('ru') ? 'ru' : 'uz';
const RU = {
  'Qurilma tekshirilmoqda': 'Проверка устройства', 'Bir necha soniya kuting…': 'Подождите пару секунд…',
  'Qurilma belgilari yig\'ilmoqda': 'Сбор признаков устройства', 'Telegram imzosi tekshirilmoqda': 'Проверка подписи Telegram',
  'Natija olinmoqda': 'Получение результата', '🔒 Xavfsiz qurilma tekshiruvi': '🔒 Безопасная проверка устройства',
  'Telegram ichida oching': 'Откройте внутри Telegram', 'Bu sahifa faqat bot orqali ochiladi.': 'Эта страница открывается только через бота.',
  'Tasdiqlandi': 'Подтверждено', 'Botga qaytib, ovoz bera olasiz.': 'Вернитесь в бота — теперь можно голосовать.',
  'Rad etildi': 'Отклонено', 'Bu qurilmadan boshqa akkaunt allaqachon qatnashgan.': 'С этого устройства уже участвовал другой аккаунт.',
  'Aniqlangan akkauntlar': 'Обнаружено аккаунтов', 'Xatolik': 'Ошибка', "Qayta urinib ko'ring.": 'Попробуйте ещё раз.',
  'Tarmoq xatosi': 'Ошибка сети', "Internetni tekshirib, qayta urinib ko'ring.": 'Проверьте интернет и попробуйте снова.',
  'Qayta urinish': 'Повторить', 'Yopish': 'Закрыть', 'Salom': 'Привет', 'Qurilma tekshiruvi': 'Проверка устройства'
};
const T = s => (LANG === 'ru' && RU[s]) || s;
const hx = (type, kind) => { try { tg.HapticFeedback[type](kind); } catch (e) {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ======================= effektlar: zarrachalar + konfetti ======================= */
const cv = document.getElementById('fx'), cx = cv.getContext('2d');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0, raf = 0;
function resize() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

const dots = reduce ? [] : Array.from({ length: 36 }, () => ({
  x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .6,
  vx: (Math.random() - .5) * .25, vy: -(Math.random() * .35 + .1), a: Math.random() * .5 + .15 }));
let conf = [];

function draw() {
  raf = 0;
  cx.clearRect(0, 0, W, H);
  const rgb = root.dataset.theme === 'light' ? '60,80,200' : '255,255,255';
  for (const d of dots) {
    d.x += d.vx; d.y += d.vy;
    if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
    if (d.x < -5) d.x = W + 5;
    if (d.x > W + 5) d.x = -5;
    cx.fillStyle = `rgba(${rgb},${d.a})`; cx.beginPath(); cx.arc(d.x, d.y, d.r, 0, 6.283); cx.fill();
  }
  for (let i = conf.length - 1; i >= 0; i--) {
    const p = conf[i];
    p.vy += .14; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if (p.life <= 0 || p.y > H + 30) { conf.splice(i, 1); continue; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life / 30);
    cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  if (!document.hidden && (dots.length || conf.length)) start();
}
function start() { if (!raf) raf = requestAnimationFrame(draw); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
start();

function burst() {
  if (reduce) return;
  const r = document.getElementById('badge').getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const colors = ['#2ee59d', '#22d3ee', '#6d8dff', '#9b6bff', '#ffc857', '#ff5c7a'];
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * 6.283, sp = 4 + Math.random() * 8;
    conf.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, w: 6 + Math.random() * 6,
                h: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
                c: colors[i % colors.length], life: 90 + Math.random() * 60 });
  }
  start();
}

/* ======================= holat boshqaruvi ======================= */
const card = document.getElementById('card'), titleEl = document.getElementById('title'),
      msgEl = document.getElementById('msg'), btn = document.getElementById('btn'),
      stepEls = [...document.querySelectorAll('#steps li')];

function setState(s, title, msg) {
  card.dataset.state = s;
  titleEl.textContent = T(title); msgEl.textContent = T(msg);
  for (const el of [titleEl, msgEl]) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
}
function step(i, cls) { stepEls[i].className = cls; }
function resetSteps() { stepEls.forEach(el => el.className = ''); }
function showBtn(text, fn) { btn.textContent = T(text); btn.onclick = fn; btn.hidden = false; }

/* ======================= qurilma belgilari (mantiq o'zgarmagan) ======================= */
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function randomId() {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}
function readCookie(n) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function idbGet() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('dv', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('k');
      r.onsuccess = () => {
        const g = r.result.transaction('k').objectStore('k').get('did');
        g.onsuccess = () => res(g.result || null);
        g.onerror = () => res(null);
      };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbSet(v) {
  return new Promise(res => {
    try {
      const r = indexedDB.open('dv', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('k');
      r.onsuccess = () => {
        const t = r.result.transaction('k', 'readwrite');
        t.objectStore('k').put(v, 'did'); t.oncomplete = () => res();
      };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
}
async function getDid() {
  let d = null;
  try { d = localStorage.getItem('did'); } catch (e) {}
  d = d || readCookie('did') || await idbGet();
  if (!d) d = randomId();
  try { localStorage.setItem('did', d); } catch (e) {}
  document.cookie = 'did=' + d + '; max-age=31536000; path=/; SameSite=None; Secure';
  await idbSet(d);
  return d;
}
function canvasHash() {
  try {
    const c = document.createElement('canvas'); c.width = 240; c.height = 60;
    const x = c.getContext('2d');
    x.textBaseline = 'top'; x.font = '16px Arial';
    x.fillStyle = '#f60'; x.fillRect(10, 5, 100, 30);
    x.fillStyle = '#069'; x.fillText('Konkurs fp \u{1F3C6} 123', 4, 12);
    x.fillStyle = 'rgba(102,204,0,.7)'; x.fillText('Konkurs fp \u{1F3C6} 123', 6, 14);
    return c.toDataURL();
  } catch (e) { return 'na'; }
}
function webglInfo() {
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) + '|' + gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'na';
  } catch (e) { return 'na'; }
}
async function fingerprint() {
  const n = navigator, s = screen;
  const parts = [
    canvasHash(), webglInfo(),
    s.width + 'x' + s.height, s.colorDepth, window.devicePixelRatio,
    n.hardwareConcurrency, n.deviceMemory, n.maxTouchPoints,
    n.platform, n.language, (n.languages || []).join(','),
    Intl.DateTimeFormat().resolvedOptions().timeZone, new Date().getTimezoneOffset(),
    n.userAgent
  ];
  return sha256(parts.join('||'));
}

/* ======================= tekshiruv jarayoni ======================= */
async function run() {
  btn.hidden = true; resetSteps();
  const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  setState('scan', 'Qurilma tekshirilmoqda',
           user && user.first_name ? `${T('Salom')}, ${user.first_name}! ${T('Bir necha soniya kuting…')}` : 'Bir necha soniya kuting…');

  if (!tg || !tg.initData) {
    setState('out', 'Telegram ichida oching', 'Bu sahifa faqat bot orqali ochiladi.');
    return;
  }
  const t0 = Date.now();
  let at = 0;
  try {
    step(0, 'act');
    const [did, fp] = await Promise.all([getDid(), fingerprint()]);
    await sleep(Math.max(0, 650 - (Date.now() - t0)));
    step(0, 'done'); hx('impactOccurred', 'light'); step(1, 'act'); at = 1;

    const pending = fetch('/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, did, fp, platform: tg.platform || '' })
    }).then(r => r.json()).then(v => ({ v }), e => ({ e }));

    await sleep(650);
    step(1, 'done'); hx('impactOccurred', 'light'); step(2, 'act'); at = 2;

    const out = await pending;
    if (out.e) throw out.e;
    await sleep(Math.max(0, 2300 - (Date.now() - t0)));
    const j = out.v;

    if (!j.ok) {
      step(2, 'fail'); hx('notificationOccurred', 'error');
      setState('err', 'Xatolik', j.error || "Qayta urinib ko'ring.");
      showBtn('Qayta urinish', run);
    } else if (j.allowed) {
      step(2, 'done'); hx('notificationOccurred', 'success');
      setState('ok', 'Tasdiqlandi', 'Botga qaytib, ovoz bera olasiz.');
      burst();
      setTimeout(() => tg.close(), 2300);
    } else {
      step(2, 'fail'); hx('notificationOccurred', 'error');
      setState('bad', 'Rad etildi',
               T('Bu qurilmadan boshqa akkaunt allaqachon qatnashgan.') +
               (j.group > 1 ? ` ${T('Aniqlangan akkauntlar')}: ${j.group}.` : ''));
      showBtn('Yopish', () => tg.close());
    }
  } catch (e) {
    step(at, 'fail'); hx('notificationOccurred', 'error');
    setState('err', 'Tarmoq xatosi', "Internetni tekshirib, qayta urinib ko'ring.");
    showBtn('Qayta urinish', run);
  }
}
if (LANG === 'ru') {
  document.documentElement.lang = 'ru'; document.title = T('Qurilma tekshiruvi');
  document.querySelectorAll('.steps li, .foot, #btn').forEach(el => {
    const tn = [...el.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim());
    tn.forEach(n => { n.textContent = T(n.textContent.trim()); });
  });
}
run();
</script>
</body>
</html>
